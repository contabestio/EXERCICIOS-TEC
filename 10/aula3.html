<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <header>
    <nav>
      <p id="menu1">Menu 1</p>
      <p id="menu2">Menu 2</p>
      <p id="menu3">Menu 3</p>
    </nav>
  </header>
  <main>
    <h2 id="titulo">Aula 3 - Javascript DOM</h2>
    <p class="comandos">getElementById</p>
    <p class="comandos" id="ex1">getElementsByTagName</p>
    <p class="comandos">getElementsByClassName</p>
    <p>Comandos para pegar os elementos.</p>
  </main>
  <script>
    document.getElementById('menu1').innerHTML = 'Item 1';
    document.getElementsByTagName('p')[1].innerHTML = 'Item 2';
    document.getElementsByTagName('p')[2].innerHTML = 'Item 3';
    document.getElementsByClassName('comandos')[0].innerHTML+ '()';
    document.getElementsByClassName('comandos')[1].innerHTML+ '()';
    document.getElementsByClassName('comandos')[2].innerHTML+ '()';
    document.getElementById('ex1').style.color = "green";
  </script>
</body>
</html>
