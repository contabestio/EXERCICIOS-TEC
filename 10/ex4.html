<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url(https://www.slantmagazine.com/wp-content/uploads/2025/11/lux.jpg);

    }

    div .oi {
      display: grid;
      grid-template-rows: 2fr 1fr 1fr 1fr;
      place-items: center;
      width: 50vw;
      height: 50vh;
      background-color: rgba(255, 255, 255, 0.212);
      border-radius: 20px;
      flex-grow: 1;
    }

    div {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 50vw;
      height: 97vh;
      gap: 20px;
      overflow: hidden;

    }

    input {
      flex-grow: 1;
      background-color: white;
      border: none;
      width: 100%;
      height: 70%;
      border-radius: 20px;
    }

    button {
      flex-grow: 1;
      background-color: white;
      border: none;
      width: 60%;
      height: 70%;
      border-radius: 20px;
      color: #66aee9;
    }

    h2 {
      color: white;
      font-size: 50px;
    }

    ul {
      background-color: rgba(255, 255, 255, 0.212);
      padding: 20px;
      display: flex;
      flex-direction: column;
      list-style: none;
      gap: 10px;
      color: white;
      border-radius: 20px;
      width: 20vw;
      height: 43.5vh;
    }
  </style>
</head>

<body>
  <div>
    <div class="oi">
      <h2>Contatos</h2>
      <input id="nome" type="text" placeholder="Nome">
      <input id="tele" type="text" placeholder="Telefone">
      <button id="cada">Cadastrar</button>
    </div>
    <div>
      <ul id="lista"></ul>
    </div>
  </div>
  <script>

    let cont = [];
    const nome = document.querySelector("#nome");
    const tele = document.querySelector("#tele");
    const lista = document.querySelector("#lista");
    const cada = document.querySelector("#cada");

    let contato = {
      nome: nome.value,
      tele: tele.value
    };
    cada.addEventListener("click", addCada)

    function addCada() {
      contato = {
        nome: nome.value,
        tele: tele.value
      };
      nome.value = "";
      tele.value = "";
      cont.push(contato);
      mostrar();
    }
    function mostrar() {
      lista.innerHTML = "";
      cont.forEach(function (item) {
        const li = document.createElement("li");
        li.textContent = `${item.nome} - ${item.tele}`;
        lista.appendChild(li);
      });
    }
  </script>
</body>

</html>
